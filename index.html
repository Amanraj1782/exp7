<!DOCTYPE html>
<html>
<head>
  <title>Full Stack Integration</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>MERN Experiments(7)</h1>

<div class="buttons">
  <button onclick="show(1)">Experiment_2.3.1</button>
  <button onclick="show(2)">Experiment_2.3.2</button>
  <button onclick="show(3)">Experiment_2.3.3</button>
</div>

<!-- EXP 1 -->
<div id="exp1" class="box">
  <h2>API Integration</h2>
  <button onclick="fetchData()">Fetch Products</button>
  <div id="apiData"></div>
</div>

<!-- EXP 2 -->
<div id="exp2" class="box">
  <h2>Shopping Cart</h2>
  <button onclick="addItem()">Add Item</button>
  <ul id="cart"></ul>
</div>

<!-- EXP 3 -->
<div id="exp3" class="box">
  <h2>Real-Time Chat</h2>
  <input id="msg" placeholder="Type message">
  <button onclick="sendMsg()">Send</button>
  <div id="chatBox"></div>
</div>

<script src="script.js"></script>
</body>
</html>
