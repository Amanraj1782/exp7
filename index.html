<!DOCTYPE html>
<html>
<head>
    <title>Experiment Website</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Experiment Dashboard</h1>

<div class="nav">
    <button onclick="show('exp1')">2.1.1 CRUD</button>
    <button onclick="show('exp2')">2.1.2 MVC</button>
    <button onclick="show('exp3')">2.1.3 Catalog</button>
</div>

<!-- ================= 2.1.1 ================= -->
<div id="exp1" class="section">
    <h2>Product Management (CRUD)</h2>

    <input id="pname" placeholder="Product Name">
    <input id="pprice" placeholder="Price">
    <input id="pcat" placeholder="Category">

    <button onclick="addProduct()">Add</button>

    <div id="productList"></div>
</div>

<!-- ================= 2.1.2 ================= -->
<div id="exp2" class="section">
    <h2>Student Management (MVC)</h2>

    <input id="sname" placeholder="Student Name">
    <button onclick="addStudent()">Add Student</button>

    <ul id="studentList"></ul>
</div>

<!-- ================= 2.1.3 ================= -->
<div id="exp3" class="section">
    <h2>Product Catalog</h2>

    <button onclick="loadCatalog()">Load Products</button>

    <div id="catalog"></div>
</div>

<script src="script.js"></script>

</body>
</html>
